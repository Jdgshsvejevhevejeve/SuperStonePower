name: Build StonePowers SMP
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Plugin
        run: ./gradlew clean build --no-daemon

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: StonePowers-Plugin
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Build Resource Pack
        run: |
          if [ -d "resourcepack" ]; then
            cd resourcepack
            zip -r ../StonePowers-ResourcePack.zip .
          else
            echo "ERROR: resourcepack folder not found!"
            exit 1
          fi

      - name: Upload Resource Pack
        uses: actions/upload-artifact@v4
        with:
          name: StonePowers-ResourcePack
          path: StonePowers-ResourcePack.zip
          if-no-files-found: error
